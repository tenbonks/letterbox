name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          port: ${{ secrets.STAGING_VPS_PORT }}
          script: |
            echo "🚀 Starting staging deployment at $(date)"

            cd /path/to/staging/project || { echo "❌ Directory not found"; exit 1; }

            echo "🔄 Pulling latest code..."
            git fetch origin dev
            git reset --hard origin/dev

            echo "📦 Installing dependencies..."
            npm install --production

            echo "🔁 Restarting PM2..."
            pm2 reload staging-app || pm2 start server.js --name staging-app

            echo "✅ Staging deployment complete at $(date)"
